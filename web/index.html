<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>درس‌های من — ربات خواجه نصیر</title>
<link rel="stylesheet" href="./app.css">
</head>
<body>
<a class="skip" href="#view">پرش به محتوا</a>

<header class="topbar">
  <div class="topbar-text">
    <span class="topbar-title">درس‌ها و تکلیف‌ها</span>
    <span class="freshness" id="freshness"><span class="dot"></span><span class="freshness-text">در حال بارگذاری…</span></span>
  </div>
  <button class="iconbtn" type="button" data-act="refresh" aria-label="تازه‌سازی اطلاعات">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z"/></svg>
  </button>
</header>

<main class="view" id="view" tabindex="-1">
  <div class="skeleton-wrap" aria-hidden="true">
    <div class="skeleton skeleton-hero"></div>
    <div class="skeleton skeleton-line"></div>
    <div class="skeleton skeleton-card"></div>
    <div class="skeleton skeleton-card"></div>
  </div>
</main>

<nav class="tabbar" id="tabbar" aria-label="بخش‌ها">
  <button type="button" role="tab" data-act="tab" data-tab="home" aria-selected="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1Z"/></svg>
    <span>خانه</span>
  </button>
  <button type="button" role="tab" data-act="tab" data-tab="courses" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v15H5Zm2 6h10v2H7Zm0 4h10v2H7Zm0 4h6v2H7Z"/></svg>
    <span>درس‌ها</span>
  </button>
  <button type="button" role="tab" data-act="tab" data-act-feed="true" data-feed="assign" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h10v3H7Zm-2 4h14v16H5Zm3 4h8v2H8Zm0 4h8v2H8Z"/></svg>
    <span>تکلیف‌ها</span>
  </button>
  <button type="button" role="tab" data-act="tab" data-tab="me" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Zm0 11c4.4 0 8 2.5 8 5.5V21H4v-1.5C4 16.5 7.6 14 12 14Z"/></svg>
    <span>من</span>
  </button>
  <button type="button" role="tab" data-act="tab" data-tab="help" aria-selected="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm1 15h-2v2h2Zm-1-11a4 4 0 0 0-4 4h2a2 2 0 1 1 3 1.7c-1.2.7-2 1.6-2 3.3h2c0-1.2.7-1.9 1.7-2.5A4 4 0 0 0 12 6Z"/></svg>
    <span>راهنما</span>
  </button>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-bar">
    <button class="iconbtn" type="button" data-act="back" aria-label="بازگشت">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6 4 12l6 6V9h10V15Z"/></svg>
    </button>
    <span class="sheet-title" id="sheet-title"></span>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="overlay-card">
    <span class="spinner" aria-hidden="true"></span>
    <p id="overlay-text">در حال بارگذاری…</p>
    <p class="muted" id="overlay-note"></p>
  </div>
</div>

<p class="toast" id="toast" role="status" hidden></p>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
